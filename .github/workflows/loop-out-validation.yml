name: LOOP OUT validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Three.js module syntax
        run: node --input-type=module --check < game.js
      - name: Extract and check inline application script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text()
          start = source.index("<script>") + len("<script>")
          end = source.index("</script>", start)
          Path("/tmp/loop-out-inline.js").write_text(source[start:end])
          PY
          node --check /tmp/loop-out-inline.js
      - name: Verify required game entrypoints
        run: |
          grep -q 'startLoopOutGame' game.js
          grep -q 'stopLoopOutGame' game.js
          grep -q 'const topic="loopout:"+selectedMode' game.js
          grep -q 'blackout_player_profiles' index.html
          grep -q 'LOOP OUT' index.html
          grep -q '>RAAZIM</div>' index.html
          ! grep -q 'boot-enter\|TAP TO ENTER' index.html
      - name: Verify HTML element references
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text()
          game = Path("game.js").read_text()
          ids = re.findall(r"""\bid=["']([^"']+)["']""", html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          refs = re.findall(r"""\$\(["']([^"']+)["']\)""", html + "\n" + game)
          missing = sorted(set(refs) - set(ids))
          if duplicates or missing:
              raise SystemExit(f"DOM contract failed; duplicate IDs={duplicates}; missing IDs={missing}")
          print(f"DOM contract OK: {len(ids)} unique IDs, {len(set(refs))} referenced elements")
          PY
      - name: Browser smoke test for desktop and mobile entry
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/loop-out-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node tests/boot-smoke.mjs
